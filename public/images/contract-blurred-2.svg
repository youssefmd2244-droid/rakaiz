<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="blurFilter2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#F4F4F6"/>
  <!-- Decorative header -->
  <rect x="40" y="40" width="520" height="90" rx="8" fill="#E4E4E7"/>
  <rect x="70" y="60" width="180" height="24" rx="4" fill="#0284C7"/>
  <rect x="70" y="95" width="200" height="16" rx="4" fill="#71717A"/>
  
  <!-- Blurred confidential document body -->
  <g filter="url(#blurFilter2)">
    <rect x="60" y="170" width="480" height="20" rx="4" fill="#1E293B"/>
    <rect x="60" y="210" width="460" height="14" rx="4" fill="#475569"/>
    <rect x="60" y="235" width="420" height="14" rx="4" fill="#475569"/>
    <rect x="60" y="260" width="470" height="14" rx="4" fill="#475569"/>
    
    <rect x="60" y="310" width="300" height="16" rx="4" fill="#1E293B"/>
    <rect x="60" y="340" width="480" height="140" rx="6" fill="#CBD5E1"/>
    
    <circle cx="480" cy="650" r="45" fill="#0284C7" opacity="0.6"/>
    <rect x="80" y="630" width="160" height="40" rx="4" fill="#334155"/>
  </g>

  <!-- Confidential Overlay Badge -->
  <rect x="150" y="350" width="300" height="100" rx="16" fill="#0F0E12" fill-opacity="0.9" stroke="#38BDF8" stroke-width="2"/>
  <text x="300" y="392" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="800" font-size="20" fill="#38BDF8">طلب تصريح مسبق</text>
  <text x="300" y="424" text-anchor="middle" font-family="'Sora', sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">Authorized Access Only</text>
</svg>
